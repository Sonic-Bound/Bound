# Milestone 13: pushing a tag like v0.10.0 builds the release packages, tests them, attests where
# they came from and drafts a GitHub release with them; a person reads the draft and publishes it.
# See docs/release-process.md.
#
# Run by hand (Actions > Release > Run workflow) it's a dry run: the packages are built and kept as
# the run's artifacts, and nothing is published.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: The tag, CMakeLists.txt and the release notes agree
        run: |
          version=$(sed -n 's/^project(bound VERSION \([0-9.]*\) .*/\1/p' CMakeLists.txt)
          echo "CMakeLists.txt says $version"
          [[ -n "$version" ]] || { echo "::error::no version in CMakeLists.txt"; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::the tag is $GITHUB_REF_NAME but CMakeLists.txt says $version"
            exit 1
          fi
          if [[ ! -f "docs/release-notes/v$version.md" ]]; then
            echo "::error::docs/release-notes/v$version.md is missing"
            exit 1
          fi
          # Milestone 15: notes written ahead mark what only launch day knows (docs/launch-day.md).
          if grep -n 'LAUNCH-DAY' "docs/release-notes/v$version.md"; then
            echo "::error::docs/release-notes/v$version.md still has LAUNCH-DAY placeholders"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64 package
    needs: check
    runs-on: windows-2022
    # Qt comes from the cache CI keeps on main; without it vcpkg builds Qt, for about an hour.
    timeout-minutes: 180
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Restore the vcpkg package cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-windows-gui-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/*') }}
          restore-keys: vcpkg-windows-gui-
      - name: Inno Setup, for the installer (milestone 18)
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { throw "Inno Setup didn't install" }
      - name: Build, test and package
        # Windows PowerShell 5.1, which the script is tested with.
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          powershell -NoProfile -ExecutionPolicy Bypass -File contrib\release\package-windows.ps1 -OutDir dist -RequireInstaller
      - name: Save the vcpkg package cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-windows-gui-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/*') }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  # The oldest glibc the programs run on is the build machine's, so each is built on the oldest
  # system that has what the build needs.
  linux:
    name: Linux ${{ matrix.arch }} package
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.35: Ubuntu 22.04, Debian 12 and newer. GCC 13 (for std::format) from the
          # toolchain PPA.
          - arch: x86_64
            runner: ubuntu-22.04
            max_glibc: '2.35'
            toolchain_ppa: true
          # Milestone 14, 64-bit ARM (Oracle's and AWS's ARM servers, a Raspberry Pi on a 64-bit
          # system). glibc 2.39: Ubuntu 24.04, Debian 13, Raspberry Pi OS 13 and newer.
          - arch: aarch64
            runner: ubuntu-24.04-arm
            max_glibc: '2.39'
            toolchain_ppa: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC 13, Ninja, and the autotools vcpkg builds libsodium with
        run: |
          if [[ "${{ matrix.toolchain_ppa }}" == true ]]; then sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test; fi
          sudo apt-get update
          sudo apt-get install -y g++-13 ninja-build pkg-config autoconf automake libtool curl zip unzip tar git
          command -v cmake || sudo apt-get install -y cmake
          cmake --version | head -1
      - name: Get vcpkg
        run: |
          if [[ -x "${VCPKG_INSTALLATION_ROOT:-}/vcpkg" ]]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            # vcpkg has no ready-made tools for ARM Linux: it uses the system's cmake and ninja.
            if [[ "$(uname -m)" == aarch64 ]]; then export VCPKG_FORCE_SYSTEM_BINARIES=1; echo "VCPKG_FORCE_SYSTEM_BINARIES=1" >> "$GITHUB_ENV"; fi
            git clone --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
            echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          fi
      - name: Build, test and package
        env:
          CC: gcc-13
          CXX: g++-13
          MAX_GLIBC: ${{ matrix.max_glibc }}
        run: bash contrib/release/package-linux.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Draft the GitHub release
    needs: [check, windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # to create the release
      id-token: write      # to sign the attestations (Sigstore, through GitHub)
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum bound-* > SHA256SUMS
          cat SHA256SUMS
      - name: Attest that this workflow built them, from this tag
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # Until mainnet launches (1.0), releases are marked as pre-releases.
          prerelease=""
          if [[ "$VERSION" == 0.* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* --draft $prerelease --verify-tag \
            --title "BOUND $VERSION" --notes-file "docs/release-notes/v$VERSION.md"
